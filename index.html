<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="나의 하루"/>
<meta name="theme-color" content="#6C63FF"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>나의 하루</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --purple: #6C63FF;
  --purple-light: #EEF0FF;
  --purple-dark: #4A42CC;
  --teal: #2BBFA0;
  --teal-light: #E0F7F4;
  --amber: #F59E0B;
  --amber-light: #FEF3C7;
  --red: #EF4444;
  --red-light: #FEE2E2;
  --green: #22C55E;
  --green-light: #DCFCE7;
  --bg: #F7F8FC;
  --surface: #FFFFFF;
  --text: #1A1A2E;
  --text-2: #64647A;
  --text-3: #A0A0B8;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 2px 16px rgba(108,99,255,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}
/* --- NAV --- */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 8px; background: none; border: none; cursor: pointer;
  color: var(--text-3); font-size: 10px; font-family: inherit; gap: 4px;
  transition: color 0.2s;
}
.nav-btn.active { color: var(--purple); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-btn.active .nav-icon { transform: scale(1.1); }

/* --- SCREENS --- */
.screen { display: none; padding: 20px 16px 100px; min-height: 100dvh; }
.screen.active { display: block; }

/* --- HEADER --- */
.header { margin-bottom: 24px; }
.header-sub { font-size: 12px; color: var(--text-3); font-weight: 300; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
.header-title { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.2; }
.header-title span { color: var(--purple); }

/* --- EMOTION SCREEN --- */
.mood-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.mood-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  margin-bottom: 20px;
}
.mood-btn {
  background: var(--bg); border: 2px solid transparent;
  border-radius: var(--radius-sm); padding: 10px 4px 8px;
  cursor: pointer; text-align: center; transition: all 0.15s;
  font-family: inherit;
}
.mood-btn:active { transform: scale(0.94); }
.mood-btn.selected { background: var(--purple-light); border-color: var(--purple); }
.mood-emoji { font-size: 24px; display: block; margin-bottom: 3px; }
.mood-label { font-size: 10px; color: var(--text-2); font-family: inherit; }
.mood-btn.selected .mood-label { color: var(--purple); font-weight: 500; }

.field-label { font-size: 12px; color: var(--text-2); margin-bottom: 8px; font-weight: 500; }
textarea, input[type=text], input[type=date] {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px;
  color: var(--text); font-family: inherit; outline: none;
  transition: border-color 0.15s;
}
textarea:focus, input[type=text]:focus, input[type=date]:focus { border-color: var(--purple); }
textarea { resize: none; min-height: 72px; line-height: 1.6; }

.btn-primary {
  width: 100%; background: var(--purple); color: white; border: none;
  border-radius: var(--radius-sm); padding: 14px; font-size: 15px;
  font-weight: 700; cursor: pointer; font-family: inherit;
  margin-top: 14px; transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.02em;
}
.btn-primary:active { background: var(--purple-dark); transform: scale(0.98); }

.divider { height: 1px; background: var(--border); margin: 20px 0; }
.section-label { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; letter-spacing: 0.03em; }

.entry-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.entry-item:last-child { border-bottom: none; }
.entry-emoji-badge {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--purple-light); display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.entry-body { flex: 1; }
.entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.entry-mood-name { font-size: 13px; font-weight: 700; color: var(--text); }
.entry-date-lbl { font-size: 11px; color: var(--text-3); }
.entry-memo-txt { font-size: 12px; color: var(--text-2); line-height: 1.5; }

/* --- FRIDGE SCREEN --- */
.add-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 16px; }
.add-row input[type=text] { flex: 1; }
.add-row input[type=date] { width: 130px; }
.add-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--purple); color: white; border: none;
  font-size: 24px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; align-self: flex-end;
  transition: background 0.15s, transform 0.1s;
}
.add-btn:active { background: var(--purple-dark); transform: scale(0.94); }

.food-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow); transition: transform 0.1s;
}
.food-card:active { transform: scale(0.98); }
.food-icon { font-size: 26px; }
.food-info { flex: 1; }
.food-name-txt { font-size: 15px; font-weight: 500; color: var(--text); }
.food-exp-txt { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.badge {
  font-size: 11px; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; white-space: nowrap;
}
.badge-ok { background: var(--green-light); color: #15803D; }
.badge-soon { background: var(--amber-light); color: #92400E; }
.badge-exp { background: var(--red-light); color: #991B1B; }
.del-btn {
  background: none; border: none; color: var(--text-3);
  font-size: 18px; cursor: pointer; padding: 6px; line-height: 1;
}

.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-3);
}
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-txt { font-size: 14px; }

/* --- MEAL SCREEN --- */
.week-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
  margin-bottom: 16px;
}
.day-col {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.day-name-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; }
.day-cell {
  width: 100%; aspect-ratio: 1; border-radius: var(--radius-sm);
  background: var(--surface); border: 1.5px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; cursor: pointer; transition: all 0.15s;
  padding: 4px; font-family: inherit;
}
.day-cell:active { transform: scale(0.94); }
.day-cell.today { border-color: var(--purple); background: var(--purple-light); }
.day-num { font-size: 11px; font-weight: 700; color: var(--text-2); }
.day-cell.today .day-num { color: var(--purple); }
.day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin-top: 2px; }
.day-plus { font-size: 14px; color: var(--text-3); }

.meal-panel {
  background: var(--surface); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); display: none;
}
.meal-panel.open { display: block; }
.meal-panel-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.meal-panel-row { display: flex; gap: 8px; }
.meal-panel-row input { flex: 1; }
.btn-save-sm {
  background: var(--purple); color: white; border: none;
  border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px;
  font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn-save-sm:active { background: var(--purple-dark); }

.hint-box {
  background: var(--teal-light); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 16px; font-size: 12px;
  color: #0F766E; font-weight: 500; line-height: 1.5;
}
.hint-box span { font-size: 14px; margin-right: 4px; }

.meal-list { margin-top: 16px; }
.meal-row {
  display: flex; gap: 12px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.meal-row:last-child { border-bottom: none; }
.meal-date-col { font-size: 12px; color: var(--text-2); min-width: 52px; font-weight: 500; }
.meal-text-col { flex: 1; font-size: 14px; color: var(--text); }
.meal-del { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 16px; }

/* --- TOAST --- */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: white; padding: 10px 20px;
  border-radius: 30px; font-size: 13px; font-weight: 500;
  opacity: 0; transition: all 0.25s; z-index: 999; white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SCREENS -->
<div id="screen-emotion" class="screen active">
  <div class="header">
    <div class="header-sub" id="today-str"></div>
    <div class="header-title">오늘 <span>기분</span>이 어때요?</div>
  </div>
  <div class="mood-card">
    <div class="field-label">감정 선택</div>
    <div class="mood-grid">
      <button class="mood-btn" onclick="selectMood(this,'😊','행복')"><span class="mood-emoji">😊</span><span class="mood-label">행복</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😌','평온')"><span class="mood-emoji">😌</span><span class="mood-label">평온</span></button>
      <button class="mood-btn" onclick="selectMood(this,'🥰','감사')"><span class="mood-emoji">🥰</span><span class="mood-label">감사</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😃','설렘')"><span class="mood-emoji">😃</span><span class="mood-label">설렘</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😔','우울')"><span class="mood-emoji">😔</span><span class="mood-label">우울</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😴','피곤')"><span class="mood-emoji">😴</span><span class="mood-label">피곤</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😤','스트레스')"><span class="mood-emoji">😤</span><span class="mood-label">스트레스</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😟','걱정')"><span class="mood-emoji">😟</span><span class="mood-label">걱정</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😠','화남')"><span class="mood-emoji">😠</span><span class="mood-label">화남</span></button>
      <button class="mood-btn" onclick="selectMood(this,'😐','무감각')"><span class="mood-emoji">😐</span><span class="mood-label">무감각</span></button>
    </div>
    <div class="field-label">한 줄 메모 <span style="color:var(--text-3);font-weight:300">(선택)</span></div>
    <textarea id="emotion-memo" placeholder="오늘 있었던 일, 생각나는 것..."></textarea>
    <button class="btn-primary" onclick="saveEmotion()">✓ 오늘 기록 저장</button>
  </div>

  <div class="section-label">최근 감정 기록</div>
  <div id="emotion-list"></div>
</div>

<div id="screen-fridge" class="screen">
  <div class="header">
    <div class="header-sub">재고 관리</div>
    <div class="header-title">🧊 <span>냉장고</span></div>
  </div>
  <div class="add-row">
    <input type="text" id="food-name" placeholder="식재료 이름"/>
    <input type="date" id="food-exp"/>
    <button class="add-btn" onclick="addFood()">+</button>
  </div>
  <div id="food-list"></div>
</div>

<div id="screen-meal" class="screen">
  <div class="header">
    <div class="header-sub">주간 계획</div>
    <div class="header-title">🍽️ <span>식단플래너</span></div>
  </div>
  <div class="hint-box" id="fridge-hint"><span>💡</span>냉장고 탭에서 재료를 입력하면 여기서 활용할 수 있어요</div>
  <div class="week-grid" id="week-grid"></div>
  <div class="meal-panel" id="meal-panel">
    <div class="meal-panel-title" id="meal-panel-title">메뉴 입력</div>
    <div class="meal-panel-row">
      <input type="text" id="meal-input" placeholder="예: 된장찌개, 제육볶음"/>
      <button class="btn-save-sm" onclick="saveMeal()">저장</button>
    </div>
  </div>
  <div class="meal-list" id="meal-list"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showTab('emotion',this)">
    <span class="nav-icon">🌿</span>감정일기
  </button>
  <button class="nav-btn" onclick="showTab('fridge',this)">
    <span class="nav-icon">🧊</span>냉장고
  </button>
  <button class="nav-btn" onclick="showTab('meal',this)">
    <span class="nav-icon">🍽️</span>식단플래너
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['일','월','화','수','목','금','토'];
const today = new Date();
let selectedMood = null;
let editingDayKey = null;

// --- DATA ---
function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch(e) { return def; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

let emotions = load('emotions', []);
let foods = load('foods', []);
let meals = load('meals', {});

// --- INIT ---
document.getElementById('today-str').textContent =
  today.getFullYear() + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일 ' + DAYS[today.getDay()] + '요일';
document.getElementById('food-exp').value = new Date(Date.now()+7*86400000).toISOString().split('T')[0];

renderEmotions(); renderFoods(); buildWeekGrid(); renderMealList(); updateFridgeHint();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// --- TABS ---
function showTab(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='meal') buildWeekGrid();
}

// --- TOAST ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// --- EMOTION ---
function selectMood(btn, emoji, label) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMood = { emoji, label };
}

function saveEmotion() {
  if (!selectedMood) { showToast('기분을 먼저 선택해주세요 😊'); return; }
  const memo = document.getElementById('emotion-memo').value.trim();
  const entry = {
    ...selectedMood, memo,
    date: today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate(),
    displayDate: (today.getMonth()+1)+'월 '+today.getDate()+'일 '+DAYS[today.getDay()]+'요일',
    id: Date.now()
  };
  emotions.unshift(entry);
  if(emotions.length > 30) emotions = emotions.slice(0,30);
  save('emotions', emotions);
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('emotion-memo').value = '';
  renderEmotions();
  showToast('✓ 오늘 기록이 저장됐어요');
}

function renderEmotions() {
  const el = document.getElementById('emotion-list');
  if (!emotions.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🌱</div><div class="empty-txt">아직 기록이 없어요<br/>오늘 기분을 처음으로 남겨보세요</div></div>';
    return;
  }
  el.innerHTML = emotions.slice(0,7).map(e => `
    <div class="entry-item">
      <div class="entry-emoji-badge">${e.emoji}</div>
      <div class="entry-body">
        <div class="entry-top">
          <span class="entry-mood-name">${e.label}</span>
          <span class="entry-date-lbl">${e.displayDate}</span>
        </div>
        <div class="entry-memo-txt">${e.memo || '메모 없음'}</div>
      </div>
    </div>`).join('');
}

// --- FRIDGE ---
function getDaysLeft(exp) {
  if (!exp) return 999;
  return Math.ceil((new Date(exp) - new Date(new Date().toDateString())) / 86400000);
}
function getBadge(d) {
  if (d < 0) return '<span class="badge badge-exp">유통기한 지남</span>';
  if (d === 0) return '<span class="badge badge-exp">오늘 마감</span>';
  if (d <= 3) return '<span class="badge badge-soon">D-'+d+'</span>';
  return '<span class="badge badge-ok">D-'+d+'</span>';
}
const FOOD_ICONS = ['🥬','🥕','🧅','🍅','🥩','🐟','🥚','🧀','🥛','🫙','🍄','🌽'];
function randomIcon() { return FOOD_ICONS[Math.floor(Math.random()*FOOD_ICONS.length)]; }

function addFood() {
  const name = document.getElementById('food-name').value.trim();
  const exp = document.getElementById('food-exp').value;
  if (!name) { showToast('식재료 이름을 입력해주세요'); return; }
  foods.push({ name, exp, id: Date.now(), icon: randomIcon() });
  save('foods', foods);
  document.getElementById('food-name').value = '';
  renderFoods(); updateFridgeHint();
  showToast('✓ ' + name + ' 추가됐어요');
}

function deleteFood(id) {
  foods = foods.filter(f => f.id !== id);
  save('foods', foods);
  renderFoods(); updateFridgeHint();
}

function renderFoods() {
  const el = document.getElementById('food-list');
  if (!foods.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🧊</div><div class="empty-txt">냉장고가 비어있어요<br/>식재료를 추가해보세요</div></div>';
    return;
  }
  const sorted = [...foods].sort((a,b) => getDaysLeft(a.exp) - getDaysLeft(b.exp));
  el.innerHTML = sorted.map(f => {
    const d = getDaysLeft(f.exp);
    const expStr = f.exp ? f.exp.replace(/-/g,'.') + ' 까지' : '유통기한 미입력';
    return `<div class="food-card">
      <span class="food-icon">${f.icon||'🥬'}</span>
      <div class="food-info">
        <div class="food-name-txt">${f.name}</div>
        <div class="food-exp-txt">${expStr}</div>
      </div>
      ${getBadge(d)}
      <button class="del-btn" onclick="deleteFood(${f.id})">✕</button>
    </div>`;
  }).join('');
}

function updateFridgeHint() {
  const hint = document.getElementById('fridge-hint');
  if (!hint) return;
  const soon = foods.filter(f => { const d = getDaysLeft(f.exp); return d >= 0 && d <= 3; });
  if (soon.length) {
    hint.innerHTML = '<span>⚠️</span>곧 소진할 재료: <strong>' + soon.map(f=>f.name).join(', ') + '</strong> — 이번 주 메뉴에 활용해보세요!';
  } else if (foods.length) {
    hint.innerHTML = '<span>✅</span>냉장고에 재료가 <strong>' + foods.length + '가지</strong> 있어요';
  } else {
    hint.innerHTML = '<span>💡</span>냉장고 탭에서 재료를 입력하면 여기서 활용할 수 있어요';
  }
}

// --- MEAL ---
function buildWeekGrid() {
  const grid = document.getElementById('week-grid');
  const dow = today.getDay();
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(today.getDate() - dow + i);
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    const isToday = d.toDateString() === today.toDateString();
    const hasMeal = !!meals[key];
    cols.push(`<div class="day-col">
      <div class="day-name-lbl">${DAYS[d.getDay()]}</div>
      <div class="day-cell${isToday?' today':''}" onclick="openMealEdit('${key}','${DAYS[d.getDay()]}요일 ${d.getDate()}일')">
        <span class="day-num">${d.getDate()}</span>
        ${hasMeal ? '<div class="day-dot"></div>' : '<span class="day-plus">+</span>'}
      </div>
    </div>`);
  }
  grid.innerHTML = cols.join('');
  updateFridgeHint();
}

function openMealEdit(key, label) {
  editingDayKey = key;
  const panel = document.getElementById('meal-panel');
  document.getElementById('meal-panel-title').textContent = label + ' 메뉴';
  document.getElementById('meal-input').value = meals[key] || '';
  panel.classList.add('open');
  document.getElementById('meal-input').focus();
}

function saveMeal() {
  const val = document.getElementById('meal-input').value.trim();
  if (val) meals[editingDayKey] = val;
  else delete meals[editingDayKey];
  save('meals', meals);
  document.getElementById('meal-panel').classList.remove('open');
  buildWeekGrid(); renderMealList();
  showToast('✓ 메뉴가 저장됐어요');
}

function deleteMeal(key) {
  delete meals[key]; save('meals', meals);
  buildWeekGrid(); renderMealList();
}

function renderMealList() {
  const el = document.getElementById('meal-list');
  const keys = Object.keys(meals).sort();
  if (!keys.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="section-label" style="margin-bottom:10px">이번 주 메뉴 목록</div>' +
    keys.map(k => {
      const [y,m,d] = k.split('-');
      const date = new Date(+y,+m-1,+d);
      return `<div class="meal-row">
        <span class="meal-date-col">${DAYS[date.getDay()]} ${d}일</span>
        <span class="meal-text-col">${meals[k]}</span>
        <button class="meal-del" onclick="deleteMeal('${k}')">✕</button>
      </div>`;
    }).join('');
}
</script>
</body>
</html>
